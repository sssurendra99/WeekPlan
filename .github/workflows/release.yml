name: Release
on:
  push:
    tags:
      - "v*"
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
      - name: Install runtime
        run: flatpak install -y --user flathub org.gnome.Platform//49 org.gnome.Sdk//49
      - name: Build Flatpak
        run: |
          flatpak-builder --user --repo=repo --force-clean build-dir data/flatpak/io.github.sssurendra99.WeekPlan.json
          flatpak build-bundle repo weekplan.flatpak io.github.sssurendra99.WeekPlan
      - name: Extract changelog section
        id: changelog
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          awk "/^## \[$version\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md > release-notes.md
      - uses: softprops/action-gh-release@v3
        with:
          files: weekplan.flatpak
          body_path: release-notes.md
          draft: false
          prerelease: false
