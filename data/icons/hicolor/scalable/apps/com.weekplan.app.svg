<?xml version="1.0" encoding="UTF-8"?>
<!--
  WeekPlan application icon
  GNOME HIG compliant — 128×128 base, 24px corner radius, scalable
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- Main background: GNOME Blue gradient top → bottom -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="128"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#5BA0EE"/>
      <stop offset="1"   stop-color="#3584E4"/>
    </linearGradient>

    <!-- Top shine: subtle white highlight on upper half -->
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="72"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1"   stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Inner shadow: radial darkening at edges for depth -->
    <radialGradient id="inner-shadow" cx="64" cy="64" r="90"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0.50" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1"    stop-color="#000000" stop-opacity="0.22"/>
    </radialGradient>
  </defs>

  <!-- ── Base rounded square ── -->
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>
  <rect width="128" height="128" rx="24" fill="url(#shine)"/>
  <rect width="128" height="128" rx="24" fill="url(#inner-shadow)"/>

  <!-- ── Week-header strip (calendar top bar) ── -->
  <!-- Spans the same x range as the 7 columns (x 11–117) -->
  <rect x="11" y="20" width="106" height="12" rx="3"
        fill="#ffffff" opacity="0.60"/>

  <!--
    ── 7 day columns ──
    Layout: left-margin=11, col-width=10, gap=6, right-margin=11
    Positions: 11 27 43 59 75 91 107  (col 4 = today = x 59, centre x 64)
    Height: y 36 → y 110 (74 px tall), bottom margin 18 px
  -->

  <!-- col 1 (Mon) -->
  <rect x="11"  y="36" width="10" height="74" rx="3"
        fill="#ffffff" opacity="0.90"/>
  <!-- col 2 (Tue) -->
  <rect x="27"  y="36" width="10" height="74" rx="3"
        fill="#ffffff" opacity="0.90"/>
  <!-- col 3 (Wed) -->
  <rect x="43"  y="36" width="10" height="74" rx="3"
        fill="#ffffff" opacity="0.90"/>

  <!-- col 4 (Thu = today): bar starts below the dot -->
  <rect x="59"  y="56" width="10" height="54" rx="3"
        fill="#ffffff" opacity="0.90"/>

  <!-- col 5 (Fri) -->
  <rect x="75"  y="36" width="10" height="74" rx="3"
        fill="#ffffff" opacity="0.90"/>
  <!-- col 6 (Sat) -->
  <rect x="91"  y="36" width="10" height="74" rx="3"
        fill="#ffffff" opacity="0.90"/>
  <!-- col 7 (Sun) -->
  <rect x="107" y="36" width="10" height="74" rx="3"
        fill="#ffffff" opacity="0.90"/>

  <!-- ── Today indicator: warm-yellow filled circle ── -->
  <!-- Sits at the top of col 4, replacing its upper section. -->
  <!-- cx=64 = canvas centre; cy=45 = column top (y 36) + radius (9) -->
  <circle cx="64" cy="45" r="9" fill="#FFCC42"/>

</svg>
